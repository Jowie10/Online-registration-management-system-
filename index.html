<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Smart Gate | ISBAT University</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .confirmation-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 40, 68, 0.95);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            animation: fadeIn 0.3s ease;
        }
        .confirmation-card {
            background: white;
            max-width: 90%;
            width: 420px;
            border-radius: 32px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            animation: slideUp 0.3s ease;
        }
        .confirmation-card i {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .confirmation-card h3 {
            color: #002868;
            margin-bottom: 8px;
            font-size: 1.5rem;
        }
        .confirmation-card .subtitle {
            color: #CF2E2E;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .confirmation-card .details {
            background: #f8fafc;
            border-radius: 20px;
            padding: 16px;
            margin: 20px 0;
            text-align: left;
        }
        .confirmation-card .details p {
            margin: 8px 0;
            font-size: 0.85rem;
            color: #334155;
        }
        .confirmation-card .details strong {
            color: #002868;
        }
        .message-line {
            margin: 10px 0;
            font-size: 0.9rem;
        }
        .tap-hint {
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 16px;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .btn-loading { opacity: 0.7; cursor: not-allowed; }
        .btn-loading i { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="bg-slideshow">
        <div class="bg-slideshow-track" id="bgSlideshowTrack"></div>
        <div class="bg-overlay"></div>
    </div>

    <div class="visitor-container">
        <div class="header">
            <h1><i class="fas fa-building"></i> ISBAT University</h1>
            <p>Smart Gate – Check In / Out</p>
        </div>

        <div class="form-card" id="mainCard">
            <h2><i class="fas fa-qrcode"></i> Scan at Gate</h2>
            <div class="form-group">
                <label><i class="fas fa-phone-alt"></i> Phone Number *</label>
                <input type="tel" id="phoneInput" placeholder="+256 XXX XXX XXX" required>
            </div>
            <button id="checkStatusBtn" class="btn-primary">
                <i class="fas fa-arrow-right"></i> Continue
            </button>
            <div id="messageArea" style="margin-top: 20px;"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, addDoc, updateDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJwJrrhF6LKboNZpwH7-07IHSApN5vKXg",
            authDomain: "qr-code-sign-in-91fce.firebaseapp.com",
            projectId: "qr-code-sign-in-91fce",
            storageBucket: "qr-code-sign-in-91fce.firebasestorage.app",
            messagingSenderId: "480973024477",
            appId: "1:480973024477:web:13686e41a0856a79af7f34"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const visitorsCollection = collection(db, "visitors");

        const phoneInput = document.getElementById('phoneInput');
        const checkBtn = document.getElementById('checkStatusBtn');
        const mainCard = document.getElementById('mainCard');
        const messageDiv = document.getElementById('messageArea');
        
        let isProcessing = false;

        function showMessage(text, isError = false) {
            messageDiv.innerHTML = `<div class="message-area ${isError ? 'error' : 'success'}" style="display:block;">${text}</div>`;
            setTimeout(() => { messageDiv.innerHTML = ''; }, 6000);
        }

        function normalizePhone(phone) {
            return phone.replace(/[\s+\-()]/g, '');
        }

        function formatDuration(startDate, endDate) {
            const diffMs = endDate - startDate;
            const diffMins = Math.floor(diffMs / 60000);
            const hours = Math.floor(diffMins / 60);
            const minutes = diffMins % 60;
            if (hours > 0) return `${hours}h ${minutes}m`;
            return `${minutes}m`;
        }

        // CHECK-IN CONFIRMATION (exact wording)
        function showCheckinConfirmation(name, purpose, entryTime, phone) {
            const overlay = document.createElement('div');
            overlay.className = 'confirmation-overlay';
            const timeFormatted = entryTime.toLocaleTimeString();
            const dateFormatted = entryTime.toLocaleDateString();
            overlay.innerHTML = `
                <div class="confirmation-card">
                    <i class="fas fa-check-circle" style="color: #10b981;"></i>
                    <h3>SIGN IN</h3>
                    <div class="message-line">You are now signed in.</div>
                    <div class="subtitle">WELCOME TO ISBAT UNIVERSITY</div>
                    <div class="details">
                        <p><strong>Hello ${escapeHtml(name)}</strong></p>
                        <p><strong>Purpose:</strong> ${escapeHtml(purpose)}</p>
                        <p><strong>Time:</strong> ${dateFormatted} at ${timeFormatted}</p>
                    </div>
                    <div class="message-line">Thank you for visiting our campus.</div>
                    <div class="message-line">Have a productive stay!</div>
                    <p class="tap-hint"><i class="fas fa-hand-pointer"></i> Tap anywhere to continue</p>
                </div>
            `;
            document.body.appendChild(overlay);
            const dismiss = () => { overlay.remove(); location.reload(); };
            overlay.addEventListener('click', dismiss);
            setTimeout(dismiss, 120000);
        }

        // CHECK-OUT CONFIRMATION (exact wording)
        function showCheckoutConfirmation(name, purpose, entryTime, exitTime, phone) {
            const overlay = document.createElement('div');
            overlay.className = 'confirmation-overlay';
            const entryFormatted = entryTime.toLocaleString();
            const exitFormatted = exitTime.toLocaleString();
            const duration = formatDuration(entryTime, exitTime);
            overlay.innerHTML = `
                <div class="confirmation-card">
                    <i class="fas fa-sign-out-alt" style="color: #CF2E2E;"></i>
                    <h3>SIGN OUT</h3>
                    <div class="message-line">Farewell, ${escapeHtml(name)}</div>
                    <div class="message-line">You are now signed out</div>
                    <div class="details">
                        <p><strong>You visited for:</strong> ${escapeHtml(purpose)}</p>
                        <p><strong>In:</strong> ${entryFormatted} | <strong>Out:</strong> ${exitFormatted}</p>
                        <p><strong>Duration:</strong> ${duration}</p>
                    </div>
                    <div class="message-line">We hope you achieved what you came for.</div>
                    <p class="tap-hint"><i class="fas fa-hand-pointer"></i> Tap anywhere to continue</p>
                </div>
            `;
            document.body.appendChild(overlay);
            const dismiss = () => { overlay.remove(); location.reload(); };
            overlay.addEventListener('click', dismiss);
            setTimeout(dismiss, 120000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
        }

        function showCheckInForm(phone) {
            mainCard.innerHTML = `
                <h2><i class="fas fa-sign-in-alt"></i> Check In</h2>
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Full Name *</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-id-card"></i> NIN (National ID) *</label>
                    <input type="text" id="nin" placeholder="e.g., CM1234567890AB" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-briefcase"></i> Reason for Visiting *</label>
                    <select id="purpose">
                        <option value="Administration">Administration</option>
                        <option value="Registration">Registration</option>
                        <option value="Meeting">Meeting</option>
                        <option value="Interview">Interview</option>
                        <option value="Delivery">Delivery</option>
                        <option value="Maintenance">Maintenance</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-user-tag"></i> Visiting Person/Dept (optional)</label>
                    <input type="text" id="visitingPerson" placeholder="Who are you visiting?">
                </div>
                <button id="confirmCheckInBtn" class="btn-primary">
                    <i class="fas fa-check-circle"></i> Complete Check In
                </button>
                <button id="backBtn" class="btn-primary" style="background:#6c757d; margin-top:10px;">Back</button>
            `;
            
            const confirmBtn = document.getElementById('confirmCheckInBtn');
            confirmBtn.addEventListener('click', async () => {
                if (isProcessing) return;
                isProcessing = true;
                confirmBtn.disabled = true;
                confirmBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Submitting...';
                confirmBtn.classList.add('btn-loading');
                
                try {
                    const name = document.getElementById('fullName').value.trim();
                    const nin = document.getElementById('nin').value.trim();
                    const purpose = document.getElementById('purpose').value;
                    const visitingPerson = document.getElementById('visitingPerson').value.trim();
                    
                    if (!name || !nin) {
                        showMessage('Full Name and NIN are required', true);
                        return;
                    }
                    if (nin.length < 10) {
                        showMessage('Please enter a valid NIN (at least 10 characters)', true);
                        return;
                    }
                    
                    const normalizedPhone = normalizePhone(phone);
                    const activeQuery = query(visitorsCollection, where("phone", "==", normalizedPhone), where("status", "==", "checked-in"));
                    const activeSnap = await getDocs(activeQuery);
                    if (!activeSnap.empty) {
                        showMessage('This phone number is already checked in!', true);
                        return;
                    }
                    
                    const visitorId = `VIS_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
                    const entryTime = Timestamp.now();
                    await addDoc(visitorsCollection, {
                        visitorId, name, phone: normalizedPhone, nin, purpose, visitingPerson,
                        entryTime, exitTime: null, status: "checked-in"
                    });
                    showCheckinConfirmation(name, purpose, entryTime.toDate(), phone);
                } catch (err) {
                    console.error(err);
                    showMessage('Check-in failed. Please try again.', true);
                    confirmBtn.disabled = false;
                    confirmBtn.innerHTML = '<i class="fas fa-check-circle"></i> Complete Check In';
                    confirmBtn.classList.remove('btn-loading');
                    isProcessing = false;
                }
            });
            
            document.getElementById('backBtn').addEventListener('click', () => location.reload());
        }

        checkBtn.addEventListener('click', async () => {
            if (isProcessing) return;
            const rawPhone = phoneInput.value.trim();
            if (!rawPhone) {
                showMessage('Please enter your phone number', true);
                return;
            }
            if (!/^[\d\s+()-]{8,}$/.test(rawPhone)) {
                showMessage('Please enter a valid phone number (minimum 8 digits)', true);
                return;
            }
            const phone = normalizePhone(rawPhone);
            isProcessing = true;
            checkBtn.disabled = true;
            checkBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Checking...';
            try {
                const activeQuery = query(visitorsCollection, where("phone", "==", phone), where("status", "==", "checked-in"));
                const activeSnap = await getDocs(activeQuery);
                if (!activeSnap.empty) {
                    // CHECK OUT
                    const docRef = activeSnap.docs[0];
                    const visitor = docRef.data();
                    const exitTime = Timestamp.now();
                    await updateDoc(docRef.ref, { exitTime, status: "checked-out" });
                    const entryDate = visitor.entryTime.toDate ? visitor.entryTime.toDate() : new Date(visitor.entryTime);
                    const exitDate = exitTime.toDate();
                    showCheckoutConfirmation(visitor.name, visitor.purpose, entryDate, exitDate, phone);
                    phoneInput.value = '';
                } else {
                    // CHECK IN – show form
                    showCheckInForm(phone);
                }
            } catch (err) {
                console.error(err);
                showMessage('Error connecting to server. Please try again.', true);
            } finally {
                if (!document.getElementById('confirmCheckInBtn')) {
                    checkBtn.disabled = false;
                    checkBtn.innerHTML = '<i class="fas fa-arrow-right"></i> Continue';
                    isProcessing = false;
                } else {
                    isProcessing = false;
                }
            }
        });

        // Background slideshow (unchanged)
        const possibleImages = ["1.jpg","1.jpeg","2.jpg","2.jpeg","3.jpg","3.jpeg","4.jpg","4.jpeg","5.jpg","5.jpeg","6.jpg","6.jpeg","7.jpg","7.jpeg","8.jpg","8.jpeg","9.jpg","9.jpeg","10.jpg","10.jpeg"];
        let validImages = [], currentBgSlide = 0, bgSlideInterval = null;
        const track = document.getElementById('bgSlideshowTrack');
        async function findExistingImages() {
            const results = await Promise.all(possibleImages.map(async img => ({ url: img, exists: await new Promise(resolve => { const i = new Image(); i.onload = () => resolve(true); i.onerror = () => resolve(false); i.src = img; }) })));
            validImages = results.filter(r => r.exists).map(r => r.url);
            if (validImages.length === 0) document.body.style.backgroundColor = '#e0f2fe';
            return validImages.length > 0;
        }
        function buildBgSlideshow() { if (!track || !validImages.length) return; track.innerHTML = validImages.map((img, i) => `<div class="bg-slide" data-index="${i}"><img src="${img}" class="bg-slide-image" loading="eager"></div>`).join(''); }
        function goToBgSlide(i) { if (!validImages.length) return; if (i < 0) i = validImages.length-1; if (i >= validImages.length) i = 0; currentBgSlide = i; if(track) track.style.transform = `translateX(-${currentBgSlide*100}%)`; }
        function nextBgSlide() { goToBgSlide(currentBgSlide+1); }
        function startBgAutoPlay() { if (bgSlideInterval) clearInterval(bgSlideInterval); if (validImages.length <= 1) return; bgSlideInterval = setInterval(nextBgSlide, 5000); }
        async function initBgSlideshow() { if (await findExistingImages()) { buildBgSlideshow(); startBgAutoPlay(); } }
        initBgSlideshow();
        window.addEventListener('beforeunload', () => { if (bgSlideInterval) clearInterval(bgSlideInterval); });
    </script>
</body>
</html>
