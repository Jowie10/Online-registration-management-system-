<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Visitor Management | ISBAT University</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- QR Scanner Library removed -->
</head>
<body>
    <!-- Background Watermark Slideshow -->
    <div class="bg-slideshow">
        <div class="bg-slideshow-track" id="bgSlideshowTrack"></div>
        <div class="bg-overlay"></div>
    </div>

    <div class="visitor-container">
        <div class="header">
            <h1><i class="fas fa-building"></i> ISBAT University</h1>
            <p>Visitor Registration System</p>
        </div>

        <!-- Mode Selection -->
        <div class="mode-selector">
            <button id="entryModeBtn" class="mode-btn active">
                <i class="fas fa-sign-in-alt"></i> Check In
            </button>
            <button id="exitModeBtn" class="mode-btn">
                <i class="fas fa-sign-out-alt"></i> Check Out
            </button>
        </div>

        <!-- Check In Panel -->
        <div id="entryPanel" class="form-card active-panel">
            <h2><i class="fas fa-sign-in-alt"></i> Check In</h2>
            <form id="visitorForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Full Name *</label>
                    <input type="text" id="visitorName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone-alt"></i> Phone Number *</label>
                    <input type="tel" id="visitorPhone" placeholder="+256 XXX XXX XXX" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-briefcase"></i> Purpose of Visit</label>
                    <select id="visitorPurpose">
                        <option value="Administration">Administration</option>
                        <option value="Registration">Registration</option>
                        <option value="Meeting">Meeting</option>
                        <option value="Interview">Interview</option>
                        <option value="Delivery">Delivery</option>
                        <option value="Maintenance">Maintenance</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-user-tag"></i> Visiting Person/Dept</label>
                    <input type="text" id="visitingPerson" placeholder="Optional - Who are you visiting?">
                </div>
                <button type="submit" class="btn-primary">
                    <i class="fas fa-check-circle"></i> Check In
                </button>
            </form>

            <!-- Success Message (No QR code) -->
            <div id="successArea" style="display: none; margin-top: 20px;">
                <div class="success-card">
                    <i class="fas fa-check-circle" style="font-size: 48px; color: #10b981;"></i>
                    <h3>Check-in Successful!</h3>
                    <p>You are now registered. When leaving, click "Check Out" and enter your phone number.</p>
                </div>
            </div>
        </div>

        <!-- Check Out Panel - Phone number only (QR scanner removed) -->
        <div id="exitPanel" class="form-card">
            <h2><i class="fas fa-sign-out-alt"></i> Check Out</h2>
            <div class="info-note">
                <i class="fas fa-info-circle"></i> Enter the phone number you used to check in
            </div>
            <div class="form-group">
                <label><i class="fas fa-phone-alt"></i> Phone Number *</label>
                <input type="tel" id="checkoutPhone" placeholder="Enter your phone number" required>
            </div>
            <button id="manualCheckoutBtn" class="btn-primary">
                <i class="fas fa-sign-out-alt"></i> Check Out
            </button>
            <div id="exitMessage" class="scan-result" style="margin-top: 15px;"></div>
        </div>

        <!-- Message Area -->
        <div id="messageArea" class="message-area"></div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
