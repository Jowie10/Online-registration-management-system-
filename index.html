<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Visitor Management | ISBAT University</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
    <!-- Background Watermark Slideshow -->
    <div class="bg-slideshow">
        <div class="bg-slideshow-track" id="bgSlideshowTrack">
            <!-- Background images will be injected here -->
        </div>
        <!-- Dark overlay for text readability -->
        <div class="bg-dark-overlay"></div>
    </div>

    <div class="visitor-container">
        <div class="header">
            <h1><i class="fas fa-building"></i> ISBAT University</h1>
            <p>Visitor Registration System</p>
        </div>

        <!-- Mode Selection -->
        <div class="mode-selector">
            <button id="entryModeBtn" class="mode-btn active">
                <i class="fas fa-sign-in-alt"></i> Check In
            </button>
            <button id="exitModeBtn" class="mode-btn">
                <i class="fas fa-sign-out-alt"></i> Check Out
            </button>
        </div>

        <!-- Check In Panel - with 11.png watermark -->
        <div id="entryPanel" class="form-card active-panel">
            <div class="form-watermark"></div>
            <h2><i class="fas fa-sign-in-alt"></i> Check In</h2>
            <form id="visitorForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Full Name *</label>
                    <input type="text" id="visitorName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone-alt"></i> Phone Number *</label>
                    <input type="tel" id="visitorPhone" placeholder="+256 XXX XXX XXX" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-briefcase"></i> Purpose of Visit</label>
                    <select id="visitorPurpose">
                        <option value="Administration">Administration</option>
                        <option value="Registration">Registration</option>
                        <option value="Meeting">Meeting</option>
                        <option value="Interview">Interview</option>
                        <option value="Delivery">Delivery</option>
                        <option value="Maintenance">Maintenance</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-user-tag"></i> Visiting Person/Dept</label>
                    <input type="text" id="visitingPerson" placeholder="Optional - Who are you visiting?">
                </div>
                <button type="submit" class="btn-primary">
                    <i class="fas fa-check-circle"></i> Check In
                </button>
            </form>
            
            <!-- QR Code Result -->
            <div id="qrResultArea" style="display: none; margin-top: 20px;">
                <div class="qr-card">
                    <h3><i class="fas fa-qrcode"></i> Your Check-out QR Code</h3>
                    <div id="qrCodeCanvas"></div>
                    <p id="qrVisitorIdMsg" class="qr-info"></p>
                    <button id="downloadQRBtn" class="btn-small">
                        <i class="fas fa-download"></i> Save QR Code
                    </button>
                </div>
            </div>
        </div>

        <!-- Check Out Panel - with 11.png watermark -->
        <div id="exitPanel" class="form-card">
            <div class="form-watermark"></div>
            <h2><i class="fas fa-sign-out-alt"></i> Check Out</h2>
            <div class="info-note">
                <i class="fas fa-info-circle"></i> Scan your QR code to check out
            </div>
            <div id="qr-reader" style="width: 100%;"></div>
            <div id="exitScanResult" class="scan-result"></div>
            <div id="manualCheckout" class="manual-checkout">
                <p class="divider">OR</p>
                <div class="form-group">
                    <label><i class="fas fa-phone-alt"></i> Check out by Phone</label>
                    <input type="tel" id="checkoutPhone" placeholder="Enter registered phone number">
                    <button id="manualCheckoutBtn" class="btn-secondary" style="margin-top: 10px;">
                        <i class="fas fa-sign-out-alt"></i> Check Out by Phone
                    </button>
                </div>
            </div>
        </div>

        <!-- Message Area -->
        <div id="messageArea" class="message-area"></div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
